<div class="signup-component-container">
  <div class="signup-header">
    <h2>Create a new account</h2>
  </div>

  <div class="signup-form-wrapper">
    <div class="signup-form-box">
       @if (errors().length) {
        <div class="error-message" role="alert">
          <ul>
            @for (msg of errors(); track $index) {
              <li>{{ msg }}</li>
            }
          </ul>
        </div>
      }


      <form (ngSubmit)="onSubmit()" class="signup-form">
        <!-- Username -->
        <div class="form-group">
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            type="username"
            required
            [(ngModel)]="model.userName"
            class="form-control"
          />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            [(ngModel)]="model.email"
            class="form-control"
          />
        </div>

        <!-- Display Name -->
        <div class="form-group">
          <label for="displayName">Display Name</label>
          <input
            id="displayName"
            name="displayName"
            type="text"
            required
            [(ngModel)]="model.displayName"
            class="form-control"
          />
        </div>

        <!-- Password with toggle -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              required
              [(ngModel)]="model.password"
              class="form-control"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="toggle-password-btn"
              tabindex="-1"
            >
              {{ showPassword ? '😌' : '👁️' }}
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="form-group">
          <button type="submit" class="submit-btn">
            Sign up
          </button>
        </div>
      </form>

      <!-- Divider -->
      <div class="divider">
        <span>Or</span>
      </div>

      <!-- Link to Login -->
      <div class="form-group">
        <a routerLink="/login" class="link-btn">
          Sign in to existing account
        </a>
      </div>
    </div>
  </div>
</div>
